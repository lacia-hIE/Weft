# Unit and browser suites, sharded across runners. Live model suites skip
# without credentials. One job builds; the shards download its outputs (the
# workers in dist/ and the top-level .generated files the tests read) instead
# of each building again, and unit shards restore the cached upstream checkout.
name: Test
permissions:
  contents: read

# `ci` is the branch for candidate commits: it runs the suites without deploying
# (Cloudflare Workers Builds deploys main only). main moves to a commit once it passes.
on:
  push:
    branches: [ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-host:
    name: Published local DSH (${{ matrix.dsh }}${{ matrix.profile == 'desktop' && ', Desktop profile' || '' }})
    needs: build
    runs-on: ubuntu-latest
    # Same pinned image as the browser shards: Chromium and its OS packages are
    # preinstalled, so no step waits on apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --init --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-rc.2', '0.2.1-rc.3']
        profile: [web]
        # Desktop's Host child boots the same release with its own profile; Electron itself is not needed.
        include:
          - dsh: '0.2.1-rc.3'
            profile: desktop
    env:
      WEFT_LOCAL_DSH_TEST: '1'
      WEFT_LOCAL_DSH_VERSION: ${{ matrix.dsh }}
      WEFT_LOCAL_DSH_PROFILE: ${{ matrix.profile }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Install the exact published native Host
        run: npm install --prefix .generated/local-dsh --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Native profile package manager
        run: npm install --global pnpm@11.28.5
      - name: Native local Host through the production relay
        run: npx playwright test tests/browser/local-host-native.spec.ts
      - name: Retain native Host diagnostics and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-dsh-results-${{ matrix.dsh }}-${{ matrix.profile }}
          path: |
            .generated/local-dsh-native.log
            test-results
          retention-days: 7
  plugin-builder:
    name: Plugin package builder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run upstream:prepare
      - name: Build the offline compiler image
        run: node scripts/plugin-builder.mjs --local
      - name: Verify real offline compilation
        run: WEFT_BUILDER_IMAGE=$(node scripts/plugin-builder.mjs --tag) npx tsx --test tests/package-builder.test.ts
      - name: Export the verified image for publication
        run: docker save $(node scripts/plugin-builder.mjs --tag) | gzip > plugin-builder-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-builder-image
          path: plugin-builder-image.tar.gz
          retention-days: 1
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Pack test inputs
        run: tar -czf build.tgz dist apps/plugin-builder/patch.mjs $(find .generated -maxdepth 1 -type f)
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tgz
          retention-days: 1

  container:
    name: Container processes and FUSE
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Restore upstream checkout
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm run upstream:prepare
      - name: Enable FUSE
        run: test -c /dev/fuse || sudo modprobe fuse
      - name: Build the tested container locally on the runner
        run: node scripts/workspace-container.mjs --local
      - name: Select the matching local image
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync, readFileSync} from 'node:fs';
          const {reference} = JSON.parse(readFileSync('apps/workspace-container/image.json', 'utf8'));
          appendFileSync(process.env.GITHUB_ENV, `WEFT_CONTAINER_IMAGE=${reference.split('/').pop()}\n`);
          JS
      - name: Real subprocess and PTY integration
        run: npm run test:process:container
      - name: Git and FUSE regression
        run: npm run test:workspace:container
      - name: Export the verified workspace image for publication
        run: docker save $(node scripts/workspace-container.mjs --tag) | gzip > workspace-container-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-container-image
          path: workspace-container-image.tar.gz
          retention-days: 1

  unit:
    name: Unit ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      # A few suites import the pinned upstream sources at run time (the build's paths point at this checkout).
      - name: Restore upstream checkout
        id: upstream
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - name: Clone upstream checkout
        if: steps.upstream.outputs.cache-hit != 'true'
        run: node scripts/prepare-upstream.mjs
      - name: Unit tests
        run: npx tsx --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/4 tests/*.test.ts

  browser:
    name: Browser ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    # Match @playwright/test in package.json. Browsers and OS dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --init --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: IM setup browser regression
        if: matrix.shard == 1
        env:
          WEFT_BROWSER_IM: '1'
        run: npx playwright test tests/browser/im-plugin.spec.ts
      - name: Keep browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
