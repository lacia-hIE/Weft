# Unit and browser suites, sharded across runners. Live model suites skip
# without credentials. One job builds; the shards download its outputs (the
# workers in dist/ and the top-level .generated files the tests read) instead
# of each building again, and unit shards restore the cached upstream checkout.
name: Test

# `ci` is the branch for candidate commits: it runs the suites without deploying
# (Cloudflare Workers Builds deploys main only). main moves to a commit once it passes.
on:
  push:
    branches: [ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Pack test inputs
        run: tar -czf build.tgz dist $(find .generated -maxdepth 1 -type f)
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tgz
          retention-days: 1

  unit:
    name: Unit ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      # A few suites import the pinned upstream sources at run time (the build's paths point at this checkout).
      - name: Restore upstream checkout
        id: upstream
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - name: Clone upstream checkout
        if: steps.upstream.outputs.cache-hit != 'true'
        run: node scripts/prepare-upstream.mjs
      - name: Unit tests
        run: npx tsx --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/4 tests/*.test.ts

  browser:
    name: Browser ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
