# Unit and browser suites, sharded across runners. Live model suites skip
# without credentials. One job builds; the shards download its outputs (the
# workers in dist/ and the top-level .generated files the tests read) instead
# of each building again, and unit shards restore the cached upstream checkout.
name: Test
permissions:
  contents: read

# `ci` is the branch for candidate commits: it runs the suites without deploying
# (Cloudflare Workers Builds deploys main only). main moves to a commit once it passes.
on:
  push:
    branches: [ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-builder:
    name: Plugin package builder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run upstream:prepare
      - name: Build the offline compiler image
        run: node scripts/plugin-builder.mjs --local
      - name: Verify real offline compilation
        run: WEFT_BUILDER_IMAGE=$(node scripts/plugin-builder.mjs --tag) npx tsx --test tests/package-builder.test.ts
      - name: Export the verified image for publication
        run: docker save $(node scripts/plugin-builder.mjs --tag) | gzip > plugin-builder-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-builder-image
          path: plugin-builder-image.tar.gz
          retention-days: 1
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - name: Pack test inputs
        run: tar -czf build.tgz dist apps/plugin-builder/patch.mjs $(find .generated -maxdepth 1 -type f)
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tgz
          retention-days: 1

  container:
    name: Container processes and FUSE
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Restore upstream checkout
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm run upstream:prepare
      - name: Enable FUSE
        run: test -c /dev/fuse || sudo modprobe fuse
      - name: Build the tested container locally on the runner
        run: node scripts/workspace-container.mjs --local
      - name: Select the matching local image
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync, readFileSync} from 'node:fs';
          const {reference} = JSON.parse(readFileSync('apps/workspace-container/image.json', 'utf8'));
          appendFileSync(process.env.GITHUB_ENV, `WEFT_CONTAINER_IMAGE=${reference.split('/').pop()}\n`);
          JS
      - name: Real subprocess and PTY integration
        run: npm run test:process:container
      - name: Git and FUSE regression
        run: npm run test:workspace:container
      - name: Export the verified workspace image for publication
        run: docker save $(node scripts/workspace-container.mjs --tag) | gzip > workspace-container-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-container-image
          path: workspace-container-image.tar.gz
          retention-days: 1

  unit:
    name: Unit ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      # A few suites import the pinned upstream sources at run time (the build's paths point at this checkout).
      - name: Restore upstream checkout
        id: upstream
        uses: actions/cache/restore@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - name: Clone upstream checkout
        if: steps.upstream.outputs.cache-hit != 'true'
        run: node scripts/prepare-upstream.mjs
      - name: Unit tests
        run: npx tsx --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/4 tests/*.test.ts

  browser:
    name: Browser ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Ubuntu archive for browser dependencies
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$apt_source"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xzf build.tgz
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Keep browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
