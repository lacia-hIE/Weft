# Unit and browser suites, sharded across runners. Live model suites skip
# without credentials. Each shard builds on its own: the build reuses the
# cached upstream checkout and npm cache, which is faster than moving the
# build outputs between jobs.
name: Test

# `ci` is the branch for candidate commits: it runs the suites without deploying
# (Cloudflare Workers Builds deploys main only). main moves to a commit once it passes.
on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx tsx --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/4 tests/*.test.ts

  browser:
    name: Browser ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: deepseek-harness
          key: upstream-${{ hashFiles('upstream.lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7
